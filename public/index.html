<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Autonoleggio">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/icon.svg">
    <title>Autonoleggio Gestionale</title>
    <!-- Add FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Basic styling */
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 250px; background: #2c3e50; color: #fff; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-size: 1.5em; font-weight: bold; background: #1a252f; text-align: center; }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 10px 0; }
        .sidebar-nav a { display: block; padding: 15px 20px; color: #ecf0f1; text-decoration: none; }
        .sidebar-nav a:hover, .sidebar-nav a.active { background: #34495e; border-left: 4px solid #3498db; padding-left: 16px; }
        .sidebar-nav i { margin-right: 10px; width: 20px; text-align: center; }
        .main-content { flex: 1; display: flex; flex-direction: column; background: #f5f6fa; overflow-y: auto; }
        .topbar { background: #fff; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .page-title { margin: 0; font-size: 1.5em; color: #2c3e50; }
        .content { padding: 20px; flex: 1; overflow-y: auto; }
        
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #333; color: #fff; padding: 15px 20px; border-radius: 4px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); opacity: 0; transition: opacity 0.3s, transform 0.3s; transform: translateY(-10px); display: flex; align-items: center; justify-content: space-between; min-width: 250px; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.success { background: #2ecc71; }
        .toast.error { background: #e74c3c; }
        .toast.warning { background: #f1c40f; color: #333; }
        
        #modal-container { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center; }
        #modal-container.show { display: flex; }
        .modal-content { background: #fff; border-radius: 8px; width: 500px; max-width: 90%; max-height: 90%; display: flex; flex-direction: column; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-header { padding: 15px 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { margin: 0; font-size: 1.2em; }
        .modal-close { background: none; border: none; font-size: 1.5em; cursor: pointer; color: #7f8c8d; }
        .modal-close:hover { color: #333; }
        .modal-body { padding: 20px; overflow-y: auto; }
        
        #loader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.7); z-index: 9998; justify-content: center; align-items: center; flex-direction: column; }
        #loader.show { display: flex; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">Autonoleggio</div>
        <div class="sidebar-nav">
            <a href="#/dashboard" class="nav-link" data-route="/dashboard"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="#/calendar" class="nav-link" data-route="/calendar"><i class="fas fa-calendar-days"></i> Calendario</a>
            <a href="#/vehicles" class="nav-link" data-route="/vehicles"><i class="fas fa-car"></i> Veicoli</a>
            <a href="#/customers" class="nav-link" data-route="/customers"><i class="fas fa-users"></i> Clienti</a>
            <a href="#/rentals" class="nav-link" data-route="/rentals"><i class="fas fa-file-contract"></i> Noleggi</a>
            <a href="#/maintenance" class="nav-link" data-route="/maintenance"><i class="fas fa-tools"></i> Manutenzione</a>
            <a href="#/finance" class="nav-link" data-route="/finance"><i class="fas fa-euro-sign"></i> Finanze</a>
            <a href="#/settings" class="nav-link" data-route="/settings"><i class="fas fa-cog"></i> Impostazioni</a>
        </div>
    </div>
    <div class="main-content">
        <div class="topbar">
            <h1 class="page-title" id="page-title">Dashboard</h1>
            <div class="user-info">
                <i class="fas fa-user-circle" style="font-size: 1.5em; color: #7f8c8d;"></i>
            </div>
        </div>
        <div class="content" id="app-content">
            <!-- Dynamic content will be loaded here by app.js -->
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <!-- Modal Container -->
    <div id="modal-container">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">Modal</h2>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Modal dynamic content -->
            </div>
        </div>
    </div>

    <!-- Global Loader -->
    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-weight:bold; color:#2c3e50;">Caricamento...</p>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/document-scan.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
